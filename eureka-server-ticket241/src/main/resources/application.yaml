spring:
  application:
    name: eureka-server-ticket241

server:
  port: 8781

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8781/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000